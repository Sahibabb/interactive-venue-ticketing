<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Venue Ticketing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Interactive Venue Ticketing</h1>
  <p id="status-message">Loading venue...</p>

  <div class="layout">
    <div class="map-area">
      <div class="map-controls" role="group" aria-label="Map controls">
        <button type="button" id="zoom-in-btn">Zoom In +</button>
        <button type="button" id="zoom-out-btn">Zoom Out -</button>
        <button type="button" id="move-up-btn">Up &uarr;</button>
        <button type="button" id="move-down-btn">Down &darr;</button>
        <button type="button" id="move-left-btn">Left &larr;</button>
        <button type="button" id="move-right-btn">Right &rarr;</button>
        <button type="button" id="reset-view-btn" class="reset-btn">Reset / Center</button>
      </div>

      <ul class="legend" aria-label="Seat legend">
        <li><span class="legend-box legend-available"></span> Available</li>
        <li><span class="legend-box legend-inspected"></span> Inspected</li>
        <li><span class="legend-box legend-incart"></span> In cart</li>
        <li><span class="legend-box legend-unavailable"></span> Unavailable</li>
      </ul>

      <div id="map-viewport" class="map-viewport">
        <div id="map-content" class="map-content">
          <div class="stage">STAGE</div>
          <div id="seat-map" class="venue"></div>
          <div class="entrance">ENTRANCE</div>
        </div>
      </div>
    </div>

    <aside class="side-panel">
      <h2>Seat details</h2>
      <div id="seat-details">
        <p class="hint">Click a seat to see its details.</p>
      </div>
      <button type="button" id="add-to-cart-btn" disabled>ADD TO CART</button>

      <h2 class="cart-title">Your cart</h2>
      <p id="cart-empty" class="hint">Your cart is empty.</p>
      <ul id="cart-list" class="cart-list"></ul>
      <p class="cart-total">Total: <span id="cart-total">0 AZN</span></p>
    </aside>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
